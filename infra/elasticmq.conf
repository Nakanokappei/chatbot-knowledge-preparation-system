# ElasticMQ — SQS-compatible queue for the local development stack.
#
# Replaces the AWS SQS queues that the pipeline used before the demo
# environment was decommissioned. Queue names match the Terraform ones
# (module.sqs) so no application configuration has to differ between
# local and AWS beyond the endpoint URL.

include classpath("application.conf")

# Advertised address in returned queue URLs. Uses the compose service
# name so containers on the same network can follow them directly.
node-address {
    protocol = http
    host = elasticmq
    port = 9324
    context-path = ""
}

rest-sqs {
    enabled = true
    bind-port = 9324
    bind-hostname = "0.0.0.0"
    sqs-limits = strict
}

# Pre-created queues. The application sends to a fixed queue URL rather
# than calling CreateQueue, so they must exist at startup.
queues {
    "kps-dev-pipeline" {
        defaultVisibilityTimeout = 300 seconds
        receiveMessageWait = 20 seconds
        deadLettersQueue {
            name = "kps-dev-pipeline-dlq"
            maxReceiveCount = 3
        }
    }
    "kps-dev-pipeline-dlq" { }
}
